# Example composition entry for dsh-plugin-recycle-bin.
#
# Minimal composition that activates the recycle-bin policy. The plugin needs a
# `ctx.shell` executor (pwsh or bash) plus the tool registry and system prompt.
- name: '@deepseek-ai/dsh-pwsh-local'
- name: '@deepseek-ai/dsh-shell-env'
- name: '@deepseek-ai/dsh-tool-pwsh'
- name: '@deepseek-ai/dsh-tool-ask-user'
- name: '@deepseek-ai/dsh-user-questions'
- name: 'dsh-plugin-recycle-bin'
  config:
    enabled: true
    blockDestructiveCommands: true
    forbidEmptyRecycleBin: true
    forbidWipe: true
    minFreeBytes: 104857600          # 100 MB safety threshold
    reserveBytes: 52428800           # 50 MB reserved after a recycle
    pwshPath: ''                     # optional explicit pwsh path
